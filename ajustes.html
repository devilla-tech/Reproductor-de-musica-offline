<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1">

<link
rel="stylesheet"
href="styles.css">

<link
rel="manifest"
href="manifest.json">

<title>Ajustes</title>

</head>


<body>


<main
class="phone"
data-page="settings">


<div class="status-bar">

<span>
9:41
</span>

<div class="status-icons">
▮▮▮ ))) ▣
</div>

</div>



<section class="view">


<header class="page-header">


<a
href="index.html"
class="back-link">

‹

</a>


<h1>

Ajustes

</h1>


<span></span>


</header>



<div class="settings-list">



<label class="setting-row">


<div>

<strong>

Reproducción automática

</strong>


<span>

Continuar automáticamente con la siguiente canción.

</span>

</div>


<input
id="autoplayToggle"
type="checkbox"
checked>


</label>



<label class="setting-row">


<div>


<strong>

Modo compacto

</strong>


<span>

Reduce el tamaño de algunos elementos.

</span>


</div>


<input
id="compactToggle"
type="checkbox">


</label>



<button
id="clearLibraryBtn"
class="setting-row danger-row">


<div>

<strong>

Borrar biblioteca

</strong>


<span>

Eliminar todas las canciones guardadas.

</span>

</div>


<span>

›

</span>


</button>


</div>


</section>


</main>


<script src="app.js"></script>

</body>

</html>
