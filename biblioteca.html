<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta
    name="theme-color"
    content="#06111b">

  <link
    rel="manifest"
    href="manifest.json">

  <link
    rel="stylesheet"
    href="styles.css">

  <title>Biblioteca - Nova Music</title>

</head>

<body>

<main
  class="phone"
  data-page="library">


  <div class="status-bar">

    <span>
      9:41
    </span>

    <div class="status-icons">
      ▮▮▮ ))) ▣
    </div>

  </div>


  <section class="view">

    <header class="page-header header-actions">

      <h1>
        Tu Biblioteca
      </h1>

      <button
        data-action="add-music"
        class="round-small">

        ＋

      </button>

    </header>



    <div class="tabs">

      <button
        class="tab active"
        data-filter="all">

        Todas

      </button>


      <button
        class="tab"
        data-filter="favorites">

        Favoritas

      </button>


      <button
        class="tab"
        data-filter="recent">

        Recientes

      </button>

    </div>



    <div
      id="libraryList"
      class="song-list">
    </div>


    <div
      id="libraryEmpty"
      class="empty-state">

      <div class="empty-music">
        ▥
      </div>

      <p>
        No tienes música guardada.
      </p>

      <button
        data-action="add-music">

        Agregar música

      </button>

    </div>

  </section>



  <div
    id="globalMiniPlayer"
    class="mini-player hidden">

    <div class="mini-cover">
      ♫
    </div>

    <div class="mini-info">

      <strong id="miniTitle"></strong>

      <span id="miniArtist"></span>

    </div>

    <button id="miniPlayBtn">
      ▶
    </button>

    <a href="reproductor.html">
      ☷
    </a>

  </div>



  <nav class="bottom-nav">

    <a
      href="index.html"
      class="nav-button"
      data-page="home">

      <span>⬟</span>

      <small>
        Inicio
      </small>

    </a>


    <a
      href="buscar.html"
      class="nav-button"
      data-page="search">

      <span>⌕</span>

      <small>
        Buscar
      </small>

    </a>


    <a
      href="biblioteca.html"
      class="nav-button"
      data-page="library">

      <span>▥</span>

      <small>
        Biblioteca
      </small>

    </a>


    <a
      href="premium.html"
      class="nav-button"
      data-page="premium">

      <span>◇</span>

      <small>
        Premium
      </small>

    </a>

  </nav>


  <input
    id="fileInput"
    type="file"
    accept="audio/*"
    multiple
    hidden>


  <audio
    id="audio"
    preload="metadata">
  </audio>


</main>

<script src="app.js"></script>

</body>
</html>
